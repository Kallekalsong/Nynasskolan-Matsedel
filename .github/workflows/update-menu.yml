name: Uppdatera matsedel

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-menu.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Testa menydata och sidstruktur
        run: python -m unittest discover -s tests -v
      - name: Hämta och bearbeta RSS-flödet
        run: python scripts/fetch_menu.py
        continue-on-error: true
      - name: Spara ny matsedel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menu.json
          git diff --cached --quiet || git commit -m "Uppdatera matsedeln"
          git push
      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Ladda upp webbplatsen
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - name: Vänta in Pages-artefakten
        run: sleep 15
      - name: Publicera webbplatsen
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

